name: Refresh Regulatory Data

on:
  schedule:
    # Run every other day at 13:17 UTC to stay well within free Actions minutes.
    - cron: '17 13 */2 * *'
  workflow_dispatch:
    inputs:
      months:
        description: 'Trailing months to refresh (including current month)'
        required: false
        default: '3'
        type: string

permissions:
  contents: write

concurrency:
  group: refresh-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install system PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install statewager
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Refresh trailing regulatory months
        env:
          REFRESH_MONTHS: ${{ inputs.months || '3' }}
        run: |
          python -m publish --months "$REFRESH_MONTHS" --docs-dir docs

      - name: Commit and push updated docs
        run: |
          if [ -z "$(git status --porcelain -- docs)" ]; then
            echo "No changes in docs/ to commit."
            exit 0
          fi
          git config user.name "mellowpanic"
          git config user.email "268813793+mellowpanic@users.noreply.github.com"
          git add docs
          git commit -m "chore(data): scheduled regulatory refresh"
          git pull --rebase
          git push
