name: Refresh Regulatory Data

on:
  schedule:
    # Run twice daily at 06:23 and 18:23 UTC (unlimited/free on public repos).
    - cron: '23 6,18 * * *'
  workflow_dispatch:
    inputs:
      months:
        description: 'Trailing completed months to refresh'
        required: false
        default: '4'
        type: string

permissions:
  contents: write

concurrency:
  group: refresh-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Ensure poppler-utils is installed
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends poppler-utils
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install statewager
        run: pip install .

      - name: Refresh trailing regulatory months and push
        env:
          REFRESH_MONTHS: ${{ inputs.months || '4' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if ! [[ "$REFRESH_MONTHS" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid months input: $REFRESH_MONTHS" >&2
            exit 1
          fi
          extra_flags=()
          if [ "$EVENT_NAME" = "schedule" ]; then
            extra_flags=(--recheck-months 2)
          fi
          cache_dir="${RUNNER_TEMP:-/tmp}/statewager-cache"
          git config user.name "mellowpanic"
          git config user.email "268813793+mellowpanic@users.noreply.github.com"

          for attempt in 1 2 3; do
            python -m publish --months "$REFRESH_MONTHS" ${extra_flags[@]+"${extra_flags[@]}"} --jobs 10 --cache-dir "$cache_dir" --docs-dir docs
            if [ -z "$(git status --porcelain -- docs)" ]; then
              echo "No changes in docs/ to commit."
              exit 0
            fi
            git add docs
            git commit -m "chore(data): scheduled regulatory refresh"
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "git push rejected on attempt $attempt; resetting to origin/main and rebuilding..."
              git fetch origin main
              git reset --hard origin/main
              pip install --no-deps .
            fi
          done
          exit 1
