name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/data/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dev dependencies and run pytest
        run: |
          pip install -e ".[dev]"
          pytest -v

      - name: Verify docs/index.html is in sync with publish.site
        run: |
          python - <<'PY'
          import json, pathlib
          from publish.site import render_index_html
          status = json.loads(pathlib.Path("docs/data/status.json").read_text(encoding="utf-8"))
          states = [(slug, meta["name"]) for slug, meta in status["states"].items() if "name" in meta]
          expected = render_index_html(states)
          actual = pathlib.Path("docs/index.html").read_text(encoding="utf-8")
          assert actual == expected, "docs/index.html is out of sync with publish.site.render_index_html"
          PY

      - name: Validate viewer JS and status manifest
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');
          const html = fs.readFileSync('docs/index.html', 'utf8');
          const m = html.match(/<script>\s*([\s\S]*?)\s*<\/script>/);
          assert(m, 'missing <script> block in docs/index.html');
          new vm.Script(m[1]);
          const status = JSON.parse(fs.readFileSync('docs/data/status.json', 'utf8'));
          assert(typeof status.data_hash === 'string' && status.data_hash.length === 16);
          assert(status.state_count >= 10 && status.states);
          console.log('CI viewer + status.json validation OK');
          NODE
